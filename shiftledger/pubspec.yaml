  ios:
    app_name: "ShiftLedger"
    bundle_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"

  linux:
    app_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"
    exe_name: "shiftledger"

  macos:
    app_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"
    copyright_notice: "Copyright © 2024"

  web:
    app_name: "ShiftLedger"
    short_app_name: "ShiftLedger"
    description: "Best App"

  windows:
    app_name: "ShiftLedger"
    organization: "Allysoft Solutions"
    copyright_notice: "Copyright © 2024"
    exe_name: "shiftledger"