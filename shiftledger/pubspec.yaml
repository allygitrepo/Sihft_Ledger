name: shiftledger
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1
  shared_preferences: ^2.2.2
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/shiftledger.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/shiftledger.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/shiftledger.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/shiftledger.png"
flutter:
  uses-material-design: true
  assets :
    - assets/
package_rename_config:
  android:
    app_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"
    lang: "kotlin"

  ios:
    app_name: "ShiftLedger"
    bundle_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"

  linux:
    app_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"
    exe_name: "shiftledger"

  macos:
    app_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"
    copyright_notice: "Copyright © 2024"

  web:
    app_name: "ShiftLedger"
    short_app_name: "ShiftLedger"
    description: "Best App"

  windows:
    app_name: "ShiftLedger"
    organization: "Allysoft Solutions"
    copyright_notice: "Copyright © 2024"
    exe_name: "shiftledger"