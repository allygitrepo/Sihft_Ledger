name: shiftledger
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.1

flutter:
  uses-material-design: true

package_rename_config:
  android:
    app_name: "ShiftLedger"
    package_name: "com.allysoftsolutions.shiftledger"
